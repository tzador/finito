name: mac-ci

on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/mac-ci.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac-ci.yml"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release --package-path mac
      - name: Smoke test
        run: mac/.build/release/finito --version
