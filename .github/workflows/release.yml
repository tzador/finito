name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Check Cargo.toml matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$TAG\"" Cargo.toml \
            || { echo "Cargo.toml does not say version $TAG"; exit 1; }

      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/finito \
            target/aarch64-apple-darwin/release/finito \
            target/x86_64-apple-darwin/release/finito
          lipo -info dist/finito
          dist/finito --version

      - name: Package
        run: |
          tar -C dist -czf "finito-${GITHUB_REF_NAME}-macos-universal.tar.gz" finito
          shasum -a 256 finito-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" finito-*.tar.gz checksums.txt \
            --title "$GITHUB_REF_NAME" --generate-notes

  formula:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point the formula at the tagged source tarball
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SHA=$(curl -sL "$URL" | shasum -a 256 | cut -d' ' -f1)
          sed -i "s|^  url \".*\"|  url \"$URL\"|" Formula/finito.rb
          sed -i "s|^  sha256 \".*\"|  sha256 \"$SHA\"|" Formula/finito.rb
          cat Formula/finito.rb

      - name: Commit the formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/finito.rb
          git diff --cached --quiet && exit 0
          git commit -m "Formula: ${GITHUB_REF_NAME}"
          git push origin main
